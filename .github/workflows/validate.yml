name: Validar y publicar Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pmdm-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android (grupo ${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # El paquete heredado "tools" ya no está disponible en el repositorio SDK.
          packages: platform-tools
      - name: Instalar plataforma del curso
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Compilar y analizar los proyectos distribuidos
        shell: bash
        env:
          ANDROID_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          mapfile -d '' projects < <(find proyectos -name settings.gradle.kts -print0 | LC_ALL=C sort -z)
          checked=0
          for index in "${!projects[@]}"; do
            if (( index % 4 != ANDROID_GROUP )); then continue; fi
            project="$(dirname "${projects[$index]}")"
            echo "::group::$project"
            task_started=$SECONDS
            (cd "$project" && bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --build-cache --console=plain)
            echo "Validado: $project ($((SECONDS - task_started)) s)"
            echo "::endgroup::"
            checked=$((checked + 1))
          done
          test "$checked" -gt 0
          echo "Grupo $ANDROID_GROUP: $checked proyectos comprobados"
      - name: Conservar informes Android
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports-${{ matrix.group }}
          retention-days: 14
          path: |
            proyectos/**/app/build/test-results/testDebugUnitTest/*.xml
            proyectos/**/app/build/reports/lint-results-debug.*
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Instalar Chromium
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Comprobar navegación y generar PDF
        run: |
          python scripts/test_navigation.py
          python scripts/test_lan_server.py
          python scripts/package_projects.py
          python scripts/export_pdfs.py
      - name: Comprobar enlaces, navegación y descargas
        run: |
          python scripts/check_links.py
          python scripts/check_site_ui.py
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir web con PDF
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
  deploy:
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
