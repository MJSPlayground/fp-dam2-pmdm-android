<svg xmlns="http://www.w3.org/2000/svg" width="500" height="600" viewBox="0 0 500 600" role="img" aria-labelledby="title desc">
<title id="title">De los filtros a la pantalla</title><desc id="desc">Texto normalizado y pausado y favoritos se combinan. Cada criterio sustituye la búsqueda anterior. StateFlow comparte el estado y Compose lo representa.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#1b5e20" stroke-width="1.5"/></marker></defs>
<rect width="500" height="600" rx="16" fill="#f4faf4"/>
<g fill="#ffffff" stroke="#2e7d32" stroke-width="2"><rect x="20" y="20" width="280" height="90" rx="10"/><rect x="330" y="20" width="150" height="90" rx="10"/><rect x="90" y="170" width="320" height="65" rx="10"/><rect x="50" y="295" width="400" height="95" rx="10"/><rect x="90" y="450" width="320" height="50" rx="10"/><rect x="90" y="540" width="320" height="45" rx="10"/></g>
<g font-family="sans-serif" font-size="17" fill="#17331b" text-anchor="middle"><text x="160" y="48">Texto → normalizar</text><text x="160" y="73">debounce → distinct</text><text x="160" y="97" font-size="14">Esperar pausa y evitar repetidos</text><text x="405" y="60">Solo favoritos</text><text x="405" y="84" font-size="14">true / false</text><text x="250" y="197">combine</text><text x="250" y="222" font-size="14">Último texto y último interruptor</text><text x="250" y="323">transformLatest</text><text x="250" y="350" font-size="14">Carga → búsqueda → éxito / error</text><text x="250" y="375" font-size="14">Cancela el bloque anterior</text><text x="250" y="481">stateIn → StateFlow compartido</text><text x="250" y="568">Compose representa el estado</text></g>
<g fill="none" stroke="#1b5e20" stroke-width="2" marker-end="url(#arrow)"><path d="M160 110 L160 145 L220 145 L220 168"/><path d="M405 110 L405 145 L290 145 L290 168"/><path d="M250 235 L250 292"/><path d="M250 390 L250 447"/><path d="M250 500 L250 537"/></g>
</svg>
