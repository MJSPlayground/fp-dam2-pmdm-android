<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de datos de Cuaderno</title>
  <desc id="desc">La pantalla emite un evento al ViewModel, que coordina la acción y llama al repositorio. El repositorio valida y utiliza un DAO para guardar en Room y SQLite. La consulta Flow emite datos de vuelta al ViewModel y Compose representa el nuevo estado.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#2e7d32"/></marker></defs>
  <rect width="960" height="260" rx="16" fill="#f5faf5"/>
  <g fill="#fff" stroke="#2e7d32" stroke-width="2">
    <rect x="20" y="70" width="150" height="80" rx="10"/>
    <rect x="215" y="70" width="150" height="80" rx="10"/>
    <rect x="410" y="70" width="150" height="80" rx="10"/>
    <rect x="605" y="70" width="130" height="80" rx="10"/>
    <rect x="780" y="70" width="160" height="80" rx="10"/>
  </g>
  <g fill="#163b1a" font-family="sans-serif" text-anchor="middle" font-size="20">
    <text x="95" y="103">Pantalla</text><text x="95" y="131" font-size="16">Compose</text>
    <text x="290" y="103">ViewModel</text><text x="290" y="131" font-size="16">estado y acciones</text>
    <text x="485" y="103">Repository</text><text x="485" y="131" font-size="16">acceso a datos</text>
    <text x="670" y="103">DAO</text><text x="670" y="131" font-size="16">consultas</text>
    <text x="860" y="103">Room</text><text x="860" y="131" font-size="16">SQLite</text>
    <text x="475" y="35" font-size="18">Evento: guardar una nota</text>
    <text x="480" y="220" font-size="18">Consulta observable → estado de pantalla → nueva representación</text>
  </g>
  <g stroke="#2e7d32" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M170 110h40"/><path d="M365 110h40"/><path d="M560 110h40"/><path d="M735 110h40"/>
    <path d="M860 150v30H290v-25"/><path d="M215 140h-40"/>
  </g>
</svg>
