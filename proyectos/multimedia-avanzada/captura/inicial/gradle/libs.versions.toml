[versions]
agp = "8.13.2"
kotlin = "2.2.21"
compose-bom = "2025.12.00"
activity = "1.11.0"
core = "1.17.0"
media = "1.9.4"
camera = "1.5.3"
cropper = "4.7.0"
[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
core = { module = "androidx.core:core-ktx", version.ref = "core" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material = { module = "androidx.compose.material3:material3" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
media-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media" }
media-effect = { module = "androidx.media3:media3-effect", version.ref = "media" }
media-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media" }
media-ui = { module = "androidx.media3:media3-ui", version.ref = "media" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
camera-video = { module = "androidx.camera:camera-video", version.ref = "camera" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }
cropper = { module = "com.vanniktech:android-image-cropper", version.ref = "cropper" }
junit = { module = "junit:junit", version = "4.13.2" }
androidx-test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
