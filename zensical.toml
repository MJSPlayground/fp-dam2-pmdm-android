[project]
site_name = "MJS Playground · PMDM — Android"
site_description = "Aprende desarrollo Android con Kotlin y Jetpack Compose desde Java"
site_author = "Mikel Aingeru Jorge Soteras"
site_url = "https://mjsplayground.github.io/fp-dam2-pmdm-android/"
copyright = "© Mikel Aingeru Jorge Soteras"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css", "stylesheets/colors.css"]
extra_javascript = ["javascripts/pdf-sections.js", "javascripts/extra.js"]
nav = [
  { "Inicio" = "index.md" },
  { "Itinerario del curso" = [
    { "El ecosistema Android y el entorno de desarrollo" = [
      "ecosistema/index.md", "ecosistema/tecnologias.md", "ecosistema/entorno.md",
      "ecosistema/proyecto.md", "ecosistema/practica.md", "ecosistema/repaso.md", "ecosistema/soluciones-repaso.md",
    ] },
  ] },
  { "Ampliaciones" = ["ampliaciones/index.md"] },
  { "Recursos y ayuda" = ["recursos/index.md"] },
]

[project.extra]
generator = false
# Solo estas carpetas representan temas publicables en PDF. Las agrupaciones
# de navegación pueden contener tantos temas anidados como se necesiten.
pdf_sections = ["ecosistema", "recursos"]

[project.extra.pdf_titles]
ecosistema = "El ecosistema Android y el entorno de desarrollo"
recursos = "Recursos y ayuda"

[project.theme]
name = "material"
variant = "modern"
language = "es"
logo = "assets/branding/mjs-playground.svg"
favicon = "assets/branding/mjs-playground.svg"
features = [
  "navigation.tabs", "navigation.indexes", "navigation.top", "navigation.path", "navigation.footer",
  "toc.follow", "content.code.copy", "content.code.annotate", "content.tabs.link", "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Cambiar a modo oscuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Cambiar a modo claro"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.tabbed.alternate_style = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
