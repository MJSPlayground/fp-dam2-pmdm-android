[project.extra]
generator = false
# Solo estas carpetas representan temas publicables en PDF. Las agrupaciones
# de navegación pueden contener tantos temas anidados como se necesiten.
pdf_sections = ["ecosistema", "desarrollo", "multimedia", "asincronia", "diseno", "persistencia", "redes", "firebase", "segundo-plano", "ia", "cartografia", "sensores", "calidad", "recursos"]

[project.extra.pdf_titles]
ecosistema = "El ecosistema Android y el entorno de desarrollo"
desarrollo = "Desarrollo de aplicaciones con Kotlin y Jetpack Compose"
multimedia = "Multimedia, localización y notificaciones en Android"
asincronia = "Kotlin avanzado, asincronía y efectos de Compose"
diseno = "Diseño visual avanzado, recursos y accesibilidad"
persistencia = "Persistencia y arquitectura avanzada"
redes = "Redes, mensajería y Bluetooth avanzado"
firebase = "Firebase: backend y almacenamiento en la nube"
segundo-plano = "Notificaciones avanzadas y tareas en segundo plano"
ia = "Inteligencia artificial en aplicaciones Android"
cartografia = "Cartografía y geolocalización avanzada"
sensores = "Sensores, biometría y hardware"
calidad = "Calidad, pruebas, publicación y mantenimiento"
recursos = "Recursos y ayuda"

[project.theme]
name = "material"
variant = "modern"
language = "es"
logo = "assets/branding/mjs-playground.svg"
favicon = "assets/branding/mjs-playground.svg"
features = [
  "navigation.tabs", "navigation.indexes", "navigation.top", "navigation.path", "navigation.footer",
  "toc.follow", "content.code.copy", "content.code.annotate", "content.tabs.link", "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Cambiar a modo oscuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Cambiar a modo claro"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.tabbed.alternate_style = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
